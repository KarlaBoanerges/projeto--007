<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Login</title>
    <link rel="stylesheet" href="estilo/style.css">
    <link rel="stylesheet" href="estilo/mediasqueries.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">
</head>


<body>
    <main>
        <section id="login">
            <div id="imagem">
               
            </div>

            <div id="formulario">

                <h1>Login</h1>

                <p>Seja Bem-vindo(a) novamente!</p> <br>
                <p>Faça o Login para sua conta e começar um seu momento com Deus.</p>

                <form action="login.php" method="post" autocomplete="on">

                    <div class="campo">
                        <span class="material-icons">person</span>
                        <input type="email" name="login" id="ilogin" placeholder="Digite seu e-mail" autocomplete="email" required maxlength="40">
                        <label for="ilogin">Login</label>

                    </div>

                    <div class="campo">
                        <span class="material-icons">vpn_key</span>
                        <input type="password" name="senha" id="isenha" placeholder="Digite sua senha" autocomplete="current-password" required minlength="8" maxlength="10">
                        <label for="isenha">Senha</label>

                    </div>

                        <input type="submit" value="Entrar">
                        <input type="reset" value="Limpar">
                        <a class= "botao" href="esqueci.html">Esqueci a Senha <span class="material-icons">mail</span></a>
                        
                    

                </form>

            </div>

        </section>
    </main>
    
</body>
</html>
